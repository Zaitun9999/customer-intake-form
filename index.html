<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Submissions</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #333; font-size: 24px; text-align: center; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccd0d2; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:focus, textarea:focus { outline: none; border-color: #007bff; }
        button { background: #007bff; color: white; padding: 12px; border: none; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Submit Your Details</h2>
        <form id="submissionForm">
            <div class="group">
                <label>Full Name</label>
                <input type="text" id="fullName" required placeholder="John Doe">
            </div>
            <div class="group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>
            <div class="group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="+256 700 000000">
            </div>
            <div class="group">
                <label>Message/Notes</label>
                <textarea id="message" rows="3" placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit">Submit Form</button>
        </form>
    </div>

    <script>
        // ⚠️ REPLACE THIS WITH YOUR ACTUALLY GENERATED RENDER WEB SERVICE URL
        const RENDER_BACKEND_URL = "https://zaitun.onrender.com";

        document.getElementById('submissionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch(`${RENDER_BACKEND_URL}/api/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('🎉 Success! Your details have been recorded automatically.');
                    document.getElementById('submissionForm').reset();
                } else {
                    alert('⚠️ Submission failed: ' + (result.error || 'Unknown server error'));
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('❌ Unable to contact the cloud server.');
            }
        });
    </script>
</body>
</html>
